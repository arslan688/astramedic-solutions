<svg xmlns="http://www.w3.org/2000/svg" width="540" height="580" viewBox="0 0 540 580" role="img" aria-labelledby="seoGeoTitle seoGeoDesc">
  <title id="seoGeoTitle">Illustrative AI Search &amp; SEO Citation Preview</title>
  <desc id="seoGeoDesc">A colorful, realistic interface showing an AI search answer citing a well-structured Pakistani business website with schema markup and SEO signals.</desc>

  <defs>
    <!-- Soft outer card shadow -->
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <!-- Subtle inner card shadow -->
    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e1b4b" flood-opacity="0.05" />
    </filter>
    <!-- AI Overview Gradient (Indigo -> Violet -> Cyan) -->
    <linearGradient id="aiGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff" />
      <stop offset="55%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#ecfeff" />
    </linearGradient>
    <!-- AI Border Gradient -->
    <linearGradient id="aiBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <!-- Sparkle Icon Gradient -->
    <linearGradient id="sparkleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <!-- Search Bar Focus Gradient -->
    <linearGradient id="searchBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Main Outer Container -->
  <g filter="url(#cardShadow)">
    <rect x="20" y="16" width="500" height="544" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  </g>
  <rect x="378" y="32" width="118" height="22" rx="11" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
  <circle cx="391" cy="43" r="3.5" fill="#16a34a" />
  <text x="401" y="47" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#15803d">Schema Verified</text>

  <!-- Browser Window Frame -->
  <rect x="44" y="64" width="452" height="448" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
  
  <!-- Browser Top Bar -->
  <path d="M58 64h424a14 14 0 0 1 14 14v24H44V78a14 14 0 0 1 14-14Z" fill="#f1f5f9" />
  <line x1="44" y1="102" x2="496" y2="102" stroke="#e2e8f0" stroke-width="1" />
  <circle cx="64" cy="83" r="5" fill="#f87171" />
  <circle cx="80" cy="83" r="5" fill="#fbbf24" />
  <circle cx="96" cy="83" r="5" fill="#34d399" />
  
  <!-- Browser URL Pill -->
  <rect x="165" y="72" width="210" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <!-- Lock icon -->
  <rect x="195" y="81" width="7" height="6" rx="1.5" fill="#10b981" />
  <path d="M196.5 81v-2a2 2 0 0 1 4 0v2" fill="none" stroke="#10b981" stroke-width="1.2" />
  <text x="276" y="86.5" text-anchor="middle" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="11" font-weight="500" fill="#475569">ai-search.example.com</text>

  <!-- Realistic Search Query Bar -->
  <g filter="url(#innerShadow)">
    <rect x="62" y="116" width="416" height="42" rx="21" fill="#ffffff" stroke="url(#searchBorder)" stroke-width="1.5" />
  </g>
  <!-- Search Magnifying Glass -->
  <circle cx="85" cy="136" r="6" fill="none" stroke="#4f46e5" stroke-width="2" />
  <line x1="89.5" y1="140.5" x2="94" y2="145" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" />
  <text x="104" y="141" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#1e293b">Best web development services in Pakistan</text>
  <!-- AI Search Pill inside bar -->
  <rect x="404" y="124" width="64" height="26" rx="13" fill="#eef2ff" />
  <text x="436" y="141" text-anchor="middle" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="11" font-weight="700" fill="#4f46e5">AI Mode</text>

  <!-- AI Generative Answer Card (GEO Highlight) -->
  <g filter="url(#innerShadow)">
    <rect x="62" y="172" width="416" height="196" rx="16" fill="url(#aiGradient)" stroke="url(#aiBorder)" stroke-width="1.5" />
  </g>

  <!-- AI Sparkle Badge Header -->
  <rect x="78" y="186" width="26" height="26" rx="8" fill="url(#sparkleGrad)" />
  <!-- 4-point AI Sparkle -->
  <path d="M91 191.5c.6 3.8 1.7 4.9 5.5 5.5-3.8.6-4.9 1.7-5.5 5.5-.6-3.8-1.7-4.9-5.5-5.5 3.8-.6 4.9-1.7 5.5-5.5Z" fill="#ffffff" />
  <circle cx="97.5" cy="192.5" r="1.3" fill="#ffffff" />
  
  <text x="112" y="203" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e1b4b">AI Overview &amp; Recommended Source</text>
  <rect x="380" y="188" width="82" height="22" rx="6" fill="#ffffff" fill-opacity="0.85" stroke="#c7d2fe" stroke-width="1" />
  <text x="421" y="202.5" text-anchor="middle" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" font-weight="700" fill="#4338ca">GEO Cited #1</text>

  <!-- Realistic AI Generated Recommendation Copy -->
  <text x="78" y="232" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="12" fill="#334155">
    For businesses seeking responsive, SEO-ready websites in Pakistan,
  </text>
  <text x="78" y="250" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="12" fill="#334155">
    <tspan font-weight="700" fill="#0f172a">AstraMedic Solutions</tspan> provides structured service pages, clear
  </text>
  <text x="78" y="268" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="12" fill="#334155">
    technical foundations, and fast mobile performance.
  </text>

  <!-- Inline Citation Source Pill -->
  <rect x="78" y="284" width="384" height="68" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <!-- Source Favicon Box -->
  <rect x="90" y="296" width="32" height="32" rx="8" fill="#0f294a" />
  <text x="106" y="317" text-anchor="middle" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="14" font-weight="800" fill="#38bdf8">A</text>
  
  <text x="132" y="309" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Web Development Services in Pakistan — AstraMedic</text>
  <text x="132" y="325" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10.5" fill="#0284c7">astramedicsolutions.com › digital-solutions › web-development</text>
  
  <!-- Structured Data Chips inside Citation -->
  <rect x="132" y="332" width="76" height="14" rx="4" fill="#f1f5f9" />
  <text x="170" y="342" text-anchor="middle" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="9" font-weight="600" fill="#475569">✓ FAQ Schema</text>
  
  <rect x="214" y="332" width="88" height="14" rx="4" fill="#f1f5f9" />
  <text x="258" y="342" text-anchor="middle" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="9" font-weight="600" fill="#475569">✓ Fast Core Vitals</text>

  <rect x="308" y="332" width="86" height="14" rx="4" fill="#ecfdf5" />
  <text x="351" y="342" text-anchor="middle" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="9" font-weight="600" fill="#047857">✓ Clear Entities</text>

  <!-- Traditional Organic SEO Result Card Below -->
  <g filter="url(#innerShadow)">
    <rect x="62" y="382" width="416" height="114" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  </g>

  <!-- SEO Badge & Speed Score -->
  <rect x="78" y="396" width="134" height="20" rx="6" fill="#eff6ff" />
  <text x="145" y="409.5" text-anchor="middle" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">Organic Search Result</text>

  <!-- PageSpeed / Technical Score Pill -->
  <rect x="366" y="396" width="96" height="20" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
  <text x="414" y="409.5" text-anchor="middle" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" font-weight="700" fill="#15803d">99/100 Speed</text>

  <!-- Organic Blue Title Link -->
  <text x="78" y="436" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">
    Custom Healthcare &amp; Business Websites | SEO-Ready
  </text>
  <!-- Meta Description Lines -->
  <text x="78" y="455" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="11.5" fill="#475569">
    Logical heading hierarchy, clean URLs, mobile-first layouts, and structured
  </text>
  <text x="78" y="471" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="11.5" fill="#475569">
    service FAQs built for both human visitors and search crawlers.
  </text>

  <!-- Bottom Sitelink Chips -->
  <text x="78" y="487" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb">
    Packages &amp; Pricing  ·  Healthcare Portals  ·  Technical SEO  ·  FAQs
  </text>

</svg>